name: Runtime Build (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Prepare runtime
        run: bash scripts/prepare-runtime.sh

      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: n8n-mobile-studio-runtime-debug
          path: android/app/build/outputs/apk/debug/*.apk
