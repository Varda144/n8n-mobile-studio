plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.n8n.mobile.studio'
    compileSdk 36
    defaultConfig {
        applicationId 'com.n8n.mobile.studio'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true; buildConfig true }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.debug }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.12.0'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.1'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    kapt 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.12.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.0'
}
