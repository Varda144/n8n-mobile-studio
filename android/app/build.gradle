plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}


// ---------------------------------------------------------------------------
// Runtime payloads (opt-in)
//
// `assembleDebug`/`assembleRelease` build the embedded runtimes only when the
// repository asks for it in `runtime-payload.request` (branch list) — so ordinary
// pushes stay fast, while a payload build produces the Node engine, the n8n
// payload and the manifest that describes them (scripts/prepare-runtime.sh).
// Payload sources live in .gitignore: they are tens of megabytes of pinned
// third-party code and are never committed.
def payloadRequestFile = rootProject.file("../runtime-payload.request")
def payloadBranch = System.getenv("GITHUB_REF_NAME") ?: ""
def payloadBranches = payloadRequestFile.exists()
        ? payloadRequestFile.readLines().collect { it.trim() }.findAll { it && !it.startsWith("#") }
        : []
def payloadRequested = payloadBranch && payloadBranches.contains(payloadBranch)
def assemblingApk = gradle.startParameter.taskNames.any { it.toLowerCase().contains("assemble") }
// A payload build is only meaningful when an APK is produced; `gradlew test` and
// `gradlew lint` must stay fast.
def buildingPayloads = payloadRequested && assemblingApk

tasks.register("prepareRuntimePayloads", Exec) {
    group = "runtime"
    description = "Builds the Node engine and the runtime payloads, then regenerates the manifest."
    workingDir rootProject.file("..")
    commandLine "bash", "scripts/prepare-runtime.sh"
    // Show the payload build's progress in the CI log; it is a long cross-compile.
    standardOutput = System.out
    errorOutput = System.err
    // An APK build that advertises runtimes must fail rather than ship without them.
    environment "REQUIRE_PACKAGED", "node n8n"
    onlyIf { buildingPayloads }
}

tasks.register("verifyRuntimePayloads", Exec) {
    group = "runtime"
    description = "Checks that packaged runtimes are backed by real artifacts."
    workingDir rootProject.file("..")
    commandLine "bash", "scripts/verify-runtime.sh"
    standardOutput = System.out
    errorOutput = System.err
    onlyIf { buildingPayloads }
}

// Verification must see the payloads the build just produced.
tasks.named("verifyRuntimePayloads") { mustRunAfter "prepareRuntimePayloads" }

tasks.matching {
    it.name in ["mergeDebugAssets", "mergeReleaseAssets", "mergeDebugNativeLibs", "mergeReleaseNativeLibs"]
}.configureEach {
    dependsOn "prepareRuntimePayloads"
    dependsOn "verifyRuntimePayloads"
}

android {
    namespace 'com.n8n.mobile.studio'
    compileSdk 36
    defaultConfig {
        applicationId 'com.n8n.mobile.studio'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true; buildConfig true }
    androidResources {
        // Runtime payloads are zips of compressed content; compressing them again
        // saves nothing measurable and would hide their length from
        // AssetManager.openFd(), which the installer uses for its space check.
        noCompress += ['zip']
    }
    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        // The embedded Node engine (jniLibs/<abi>/libnode.so) must be extracted to
        // nativeLibraryDir: Android only executes app files that live there, and
        // the app starts it as a real process. Turning this off (the AGP default
        // for minSdk 26+) would leave the engine inside the APK, unexecutable.
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets {
        // Runtime payload build outputs land here (git-ignored):
        //   assets/runtime/<component>/payload.zip   -> installed by the app
        //   jniLibs/<abi>/libnode*.so                -> executed by the app
        main { jniLibs.srcDirs += ['src/main/jniLibs'] }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.debug }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    kapt 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.2.20'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.11.4'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.11.4'
}
